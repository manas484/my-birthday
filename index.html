<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Manas's 12th Birthday Party 🎂</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Trebuchet MS', Arial, sans-serif;
    background: linear-gradient(135deg, #14002e, #4c168a, #ff5fa2);
    color: white;
    text-align: center;
    overflow-x: hidden;
}

section {
    padding: 60px 20px;
}

.hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: relative;
    overflow: hidden;
}

.badge {
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.4);
    padding: 10px 22px;
    border-radius: 50px;
    margin-bottom: 25px;
    letter-spacing: 2px;
}

h1 {
    font-size: clamp(3rem, 10vw, 6rem);
    color: #ffe66d;
    text-shadow: 0 0 25px rgba(255,230,109,0.5);
}

.hero p {
    font-size: 1.2rem;
    margin: 15px 0;
    line-height: 1.7;
}

.cake {
    font-size: 100px;
    margin: 15px;
    animation: bounce 2s infinite;
}

@keyframes bounce {
